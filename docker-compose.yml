# 栖缘社 Docker Compose 部署配置
# 安全策略：生产环境仅暴露 Nginx 的 80/443 端口，其他服务仅通过 Docker 内部网络通信

services:
  # ============ MySQL 数据库 ============
  mysql:
    image: mysql:8.0
    container_name: qys_mysql
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?生产环境必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qys_match}
      MYSQL_USER: ${MYSQL_USER:-qys}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?生产环境必须设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      # 数据卷挂载
      - mysql_data:/var/lib/mysql
      # 完整建表结构（由 scripts/generate-schema.sh 从 Entity 生成，权威 schema）
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # 生产种子数据（系统配置/字典；仅 INSERT，表结构由 01-schema.sql 创建）
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # 自定义配置文件
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - qys_network
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-authentication-plugin=caching_sha2_password',
      '--max_connections=150',
      '--max_allowed_packet=64M'
    ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    cpus: 0.5

  # ============ Redis 缓存 ============
  redis:
    image: redis:7-alpine
    container_name: qys_redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?生产环境必须设置 REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - qys_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.25

  # ============ 后端 API 服务 ============
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qys_api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-qys}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-qys_match}
      DB_SYNC: ${DB_SYNC:-false}
      # 数据库连接池参数（可通过根目录 .env 覆盖，默认值适配 MySQL max_connections=150）
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-60000}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      # JWT 配置（生产环境由 env_file 提供，缺省值仅为开发环境保留）
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Admin JWT 配置（必须与 JWT_SECRET 不同）
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN:-24h}
      # 微信配置
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      # 微信支付配置
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_MCH_SERIAL_NO: ${WECHAT_MCH_SERIAL_NO:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
      WECHAT_PLATFORM_CERT_PEM: ${WECHAT_PLATFORM_CERT_PEM:-}
      WECHAT_CALLBACK_IP_WHITELIST: ${WECHAT_CALLBACK_IP_WHITELIST:-}
      # 腾讯云配置
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      # OSS + CDN 配置
      UPLOAD_STRATEGY: ${UPLOAD_STRATEGY:-local}
      CDN_ENABLED: ${CDN_ENABLED:-false}
      STATIC_BASE_URL: ${STATIC_BASE_URL:-}
      CDN_DOMAIN: ${CDN_DOMAIN:-}
      CDN_ORIGIN_TYPE: ${CDN_ORIGIN_TYPE:-origin}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_UPLOAD_PREFIX: ${OSS_UPLOAD_PREFIX:-uploads/}
      # 服务端口
      PORT: 3000
      NODE_ENV: production
      # 小程序版本号（读取 .env 的 VITE_APP_VERSION，通过 /api/system/config 返回给前端）
      VITE_APP_VERSION: ${VITE_APP_VERSION:-}
      # 容器时区（北京时间）：影响 NestJS Logger 时间戳、Date.toString、toLocaleString 等
      TZ: Asia/Shanghai
      # CORS 允许的前端域名（生产环境必须替换为实际域名，通过 .env 覆盖）
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-production-domain.com}
      # 堆上限 768MB（容器 mem_limit 1280m，预留 512MB 给堆外内存和 Buffer）
      NODE_OPTIONS: --max-old-space-size=768 --heapsnapshot-near-heap-limit=2
    volumes:
      # 上传文件目录（bind mount 解决 Docker 命名卷权限问题）
      - ./data/uploads:/app/uploads
      # 日志目录
      - ./data/logs/app:/app/logs
      # 敏感词库目录（51K 开源词库，聊天与 AI 内容审核共用；只读挂载，随 git 更新）
      - ./config:/app/config:ro
    networks:
      - qys_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1280m
    cpus: 0.5

  # ============ 管理后台 ============
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: qys_admin
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # 仅监听本机回环地址，安全访问通过 Nginx HTTPS 代理（443端口 / 路径）
      - "127.0.0.1:3001:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - qys_network
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    cpus: 0.25

  # ============ Nginx 反向代理（生产环境） ============
  nginx:
    image: nginx:alpine
    container_name: qys_nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL 证书（由 certbot 申请后挂载）
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      # certbot 验证目录（用于证书申请和续期）
      - ./docker/nginx/certbot/www:/var/www/certbot
      # 用户上传文件目录（Nginx 直接服务静态文件，减少后端压力）
      - ./data/uploads:/var/www/uploads:ro
      # Nginx 日志持久化到宿主机（与 app 日志统一在 data/logs/ 下）
      - ./data/logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - qys_network
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      # 真实 HTTP 探测：验证 nginx 进程在运行且能正常响应，而非仅校验配置语法
      # 注意：用 127.0.0.1 而非 localhost——nginx 仅监听 IPv4，busybox wget 对 localhost
      # 会优先解析到 ::1（IPv6）导致 Connection refused，误判为 unhealthy
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 64m
    cpus: 0.25

# ============ 数据卷定义 ============
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ============ 网络定义 ============
networks:
  qys_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16