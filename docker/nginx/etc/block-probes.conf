# ============ 拦截常见漏洞探测请求 ============
# 返回 444 直接断开连接，减少 404 噪音日志
# 注意：.well-known/acme-challenge 已由各 server 块单独放行，不在拦截范围

# 敏感文件/目录探测
location ~* /\.(git|env|aws|ssh|svn|hg|DS_Store)($|/) {
    return 444;
}

# PHP 文件与常见框架探针（本项目无 PHP）
location ~* (\.php$|/vendor/|/phpunit|eval-stdin\.php) {
    return 444;
}

# 配置文件与常见 Web 框架探针
location ~* (config\.(php|json|yml|yaml)$|env\.js$|/wp-admin|/wp-login|/phpmyadmin) {
    return 444;
}
