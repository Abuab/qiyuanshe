services:
  license:
    build: .
    container_name: qys_license
    restart: unless-stopped
    ports:
      # 端口绑定地址可配置（通过 .env 的 LICENSE_BIND 控制，默认仅本机监听）：
      # - 同机部署：后端容器需访问时设 LICENSE_BIND=内网IP（如 10.0.16.3），后端填 http://内网IP:3002/api
      # - 独立部署：设 LICENSE_BIND=0.0.0.0 或内网 IP，后端填 http://新服务器IP:3002/api
      # license-server 不依赖主项目网络，可独立部署到任意服务器
      - "${LICENSE_BIND:-127.0.0.1}:3002:3002"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # 管理面板鉴权密钥，部署时务必替换为强随机值
      - ADMIN_KEY=${ADMIN_KEY:-change-me}
      # 客户端接口鉴权密钥（客户后端调用 /api/activate 等需携带 X-License-Secret）
      - CLIENT_SECRET=${CLIENT_SECRET:-change-me}
      - PORT=3002
