<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>栖缘社许可证管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <!-- 登录页 -->
  <div id="loginView" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow w-full max-w-sm p-6">
      <h1 class="text-xl font-semibold mb-1">栖缘社许可证管理</h1>
      <p class="text-sm text-gray-500 mb-4">请输入 Admin Key 登录</p>
      <input id="adminKeyInput" type="password" placeholder="Admin Key"
        class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button id="loginBtn" class="w-full bg-blue-600 text-white rounded py-2 hover:bg-blue-700">登录</button>
      <p id="loginError" class="text-sm text-red-600 mt-3 hidden"></p>
    </div>
  </div>

  <!-- 主面板 -->
  <div id="mainView" class="hidden max-w-6xl mx-auto p-4 md:p-6">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">栖缘社许可证管理</h1>
      <button id="logoutBtn" class="text-sm text-gray-600 hover:text-gray-900">退出登录</button>
    </header>

    <!-- 统计 -->
    <div id="statsCards" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6"></div>

    <!-- 新增授权 -->
    <section class="bg-white rounded-lg shadow p-5 mb-6">
      <h2 class="font-semibold mb-4">新增授权（预录入）</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input id="fCustomerId" placeholder="客户ID *" class="border border-gray-300 rounded px-3 py-2" />
        <input id="fCustomerName" placeholder="客户名称" class="border border-gray-300 rounded px-3 py-2" />
        <input id="fExpiresAt" placeholder="过期时间 (YYYY-MM-DD 或 ISO)" class="border border-gray-300 rounded px-3 py-2" />
        <input id="fMachineFingerprint" placeholder="机器指纹（可选）" class="border border-gray-300 rounded px-3 py-2" />
        <input id="fDomain" placeholder="域名（可选）" class="border border-gray-300 rounded px-3 py-2" />
        <input id="fLicenseSignature" placeholder="授权签名 *" class="border border-gray-300 rounded px-3 py-2 md:col-span-3" />
      </div>
      <div class="mt-3 flex items-center gap-3">
        <button id="addBtn" class="bg-blue-600 text-white rounded px-4 py-2 hover:bg-blue-700">新增</button>
        <span id="formMsg" class="text-sm"></span>
      </div>
    </section>

    <!-- 授权列表 -->
    <section class="bg-white rounded-lg shadow p-5">
      <h2 class="font-semibold mb-4">授权列表</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left border-b text-gray-500">
              <th class="py-2 pr-3">ID</th>
              <th class="py-2 pr-3">客户</th>
              <th class="py-2 pr-3">状态</th>
              <th class="py-2 pr-3">过期时间</th>
              <th class="py-2 pr-3">上次心跳</th>
              <th class="py-2 pr-3">操作</th>
            </tr>
          </thead>
          <tbody id="licenseRows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = '/api/admin'
    const getKey = () => localStorage.getItem('license_admin_key') || ''

    const $ = (id) => document.getElementById(id)

    const statusMeta = {
      active: { text: '正常', cls: 'bg-green-100 text-green-700' },
      revoked: { text: '已吊销', cls: 'bg-red-100 text-red-700' },
      expired: { text: '已过期', cls: 'bg-gray-200 text-gray-600' },
    }

    function showLogin(show) {
      $('loginView').classList.toggle('hidden', !show)
      $('mainView').classList.toggle('hidden', show)
    }

    async function api(path, options = {}) {
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Key': getKey(),
          ...(options.headers || {}),
        },
      })
      const data = await res.json().catch(() => ({}))
      if (res.status === 401) {
        showLogin(true)
        throw new Error('Admin Key 无效')
      }
      if (!res.ok || data.success === false) {
        throw new Error(data.message || '请求失败')
      }
      return data
    }

    function fmtTime(value) {
      if (!value) return '-'
      const d = new Date(value)
      if (Number.isNaN(d.getTime())) return value
      return d.toLocaleString('zh-CN', { hour12: false })
    }

    function statusBadge(status) {
      const meta = statusMeta[status] || { text: status, cls: 'bg-gray-100 text-gray-600' }
      return `<span class="px-2 py-0.5 rounded text-xs ${meta.cls}">${meta.text}</span>`
    }

    async function loadStats() {
      const { data } = await api('/stats')
      const items = [
        { label: '总客户数', value: data.total, cls: 'text-gray-800' },
        { label: '活跃', value: data.active, cls: 'text-green-600' },
        { label: '已吊销', value: data.revoked, cls: 'text-red-600' },
        { label: '已过期', value: data.expired, cls: 'text-gray-500' },
        { label: '30天内到期', value: data.expiringSoon, cls: 'text-amber-600' },
      ]
      $('statsCards').innerHTML = items
        .map((it) => `<div class="bg-white rounded-lg shadow p-4"><div class="text-2xl font-semibold ${it.cls}">${it.value}</div><div class="text-sm text-gray-500">${it.label}</div></div>`)
        .join('')
    }

    let licenseCache = []

    function loadLicenses() {
      return api('/licenses').then(({ data }) => {
        licenseCache = data
        $('licenseRows').innerHTML = data
          .map((r) => {
            const revokeBtn = r.status === 'revoked'
              ? '<span class="text-gray-400">已吊销</span>'
              : `<button class="text-red-600 hover:underline" data-action="revoke" data-id="${r.id}">吊销</button>`
            return `<tr class="border-b">
              <td class="py-2 pr-3">${r.id}</td>
              <td class="py-2 pr-3">
                <div class="font-medium">${esc(r.customer_name || '-')}</div>
                <div class="text-xs text-gray-400">${esc(r.customer_id)}</div>
              </td>
              <td class="py-2 pr-3">${statusBadge(r.status)}</td>
              <td class="py-2 pr-3">${esc(r.expires_at || '-')}</td>
              <td class="py-2 pr-3">${fmtTime(r.last_heartbeat_at)}</td>
              <td class="py-2 pr-3">
                <button class="text-blue-600 hover:underline mr-3" data-action="extend" data-id="${r.id}">延期</button>
                ${revokeBtn}
              </td>
            </tr>`
          })
          .join('')
      })
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]))
    }

    async function refresh() {
      await Promise.all([loadStats(), loadLicenses()])
    }

    async function login() {
      const key = $('adminKeyInput').value.trim()
      if (!key) return
      localStorage.setItem('license_admin_key', key)
      try {
        await refresh()
        $('loginError').classList.add('hidden')
        showLogin(false)
      } catch (e) {
        localStorage.removeItem('license_admin_key')
        $('loginError').textContent = e.message
        $('loginError').classList.remove('hidden')
      }
    }

    async function addLicense() {
      const body = {
        customerId: $('fCustomerId').value.trim(),
        customerName: $('fCustomerName').value.trim(),
        licenseSignature: $('fLicenseSignature').value.trim(),
        expiresAt: $('fExpiresAt').value.trim() || null,
        machineFingerprint: $('fMachineFingerprint').value.trim() || null,
        domain: $('fDomain').value.trim() || null,
      }
      if (!body.customerId || !body.licenseSignature) {
        setMsg('请填写客户ID和授权签名', false)
        return
      }
      try {
        await api('/licenses', { method: 'POST', body: JSON.stringify(body) })
        setMsg('新增成功', true)
        ;['fCustomerId', 'fCustomerName', 'fExpiresAt', 'fMachineFingerprint', 'fDomain', 'fLicenseSignature']
          .forEach((id) => (($(id).value = '')))
        await refresh()
      } catch (e) {
        setMsg(e.message, false)
      }
    }

    async function revoke(id) {
      if (!confirm('确定吊销该授权？客户下次心跳后将进入宽限期。')) return
      try {
        await api(`/licenses/${id}/revoke`, { method: 'POST' })
        await refresh()
      } catch (e) {
        alert(e.message)
      }
    }

    async function extend(id) {
      const row = licenseCache.find((r) => String(r.id) === String(id))
      const value = prompt('新的过期时间 (YYYY-MM-DD 或 ISO)：', (row && row.expires_at) || '')
      if (value === null) return
      try {
        await api(`/licenses/${id}`, { method: 'PUT', body: JSON.stringify({ expiresAt: value }) })
        await refresh()
      } catch (e) {
        alert(e.message)
      }
    }

    function setMsg(text, ok) {
      $('formMsg').textContent = text
      $('formMsg').className = 'text-sm ' + (ok ? 'text-green-600' : 'text-red-600')
    }

    $('licenseRows').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]')
      if (!btn) return
      const id = btn.getAttribute('data-id')
      if (btn.getAttribute('data-action') === 'revoke') revoke(id)
      if (btn.getAttribute('data-action') === 'extend') extend(id)
    })

    $('loginBtn').addEventListener('click', login)
    $('adminKeyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login() })
    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('license_admin_key')
      showLogin(true)
    })
    $('addBtn').addEventListener('click', addLicense)

    // 初始化：已有 key 则尝试直接进入主面板
    if (getKey()) {
      refresh().then(() => showLogin(false)).catch(() => showLogin(true))
    } else {
      showLogin(true)
    }
  </script>
</body>
</html>
